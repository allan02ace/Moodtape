<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9d3ba" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1022" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moodtape">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Moodtape – AI playlists for any moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--radius:1rem;--bg:oklch(0.965 0.02 80);--fg:oklch(0.2 0.03 320);--card:oklch(0.985 0.012 80);
--primary:oklch(0.66 0.2 40);--primary-fg:oklch(0.99 0.01 80);--secondary:oklch(0.9 0.04 300);
--muted:oklch(0.92 0.02 80);--muted-fg:oklch(0.47 0.03 320);--accent:oklch(0.88 0.08 300);--border:oklch(0.86 0.025 70);--err:oklch(0.577 0.245 27)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(0.16 0.025 310);--fg:oklch(0.95 0.015 80);--card:oklch(0.21 0.03 310);
--primary:oklch(0.72 0.19 45);--primary-fg:oklch(0.18 0.03 310);--secondary:oklch(0.3 0.06 300);--muted:oklch(0.26 0.03 310);
--muted-fg:oklch(0.72 0.03 300);--accent:oklch(0.34 0.09 300);--border:oklch(1 0 0 / 12%);--err:oklch(0.704 0.191 22)}}
:root[data-theme="dark"]{--bg:oklch(0.16 0.025 310);--fg:oklch(0.95 0.015 80);--card:oklch(0.21 0.03 310);--primary:oklch(0.72 0.19 45);
--primary-fg:oklch(0.18 0.03 310);--secondary:oklch(0.3 0.06 300);--muted:oklch(0.26 0.03 310);--muted-fg:oklch(0.72 0.03 300);
--accent:oklch(0.34 0.09 300);--border:oklch(1 0 0 / 12%);--err:oklch(0.704 0.191 22)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;line-height:1.5;position:relative;overflow-x:hidden;min-height:100vh}
.glow{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
.g1{top:-160px;left:-130px;width:520px;height:520px;background:var(--primary);opacity:.25}
.g2{top:80px;right:-160px;width:480px;height:480px;background:var(--accent);opacity:.55}
.wrap{position:relative;max-width:768px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:10px;padding:16px 0 0;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
header img{width:36px;height:36px;display:block}
header span{color:var(--primary)}
main{padding:14px 0 40px}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fu{opacity:0;animation:up .6s ease-out forwards}
h1{font-size:clamp(2.8rem,9vw,4.5rem);font-weight:800;line-height:.95;letter-spacing:-.03em;margin:12px 0 0;text-wrap:balance}
h1 em{font-family:"Instrument Serif",ui-serif,Georgia,serif;font-weight:400;font-style:italic;color:var(--primary)}
.lead{max-width:36rem;font-size:1.15rem;color:var(--muted-fg);margin:20px 0 0}
.box{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius)*1.5);padding:18px;margin-top:32px}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:transparent;color:var(--fg);font:inherit}
textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:0;background:var(--secondary);color:var(--fg);padding:7px 14px;border-radius:999px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.chip:hover{outline:2px solid var(--primary)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600;font-size:.95rem}
.sw input{position:absolute;opacity:0}
.track{width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+.track{background:var(--primary)}
.sw input:checked+.track::after{transform:translateX(18px)}
.sw input:focus-visible+.track{outline:2px solid var(--primary);outline-offset:2px}
.go{background:var(--primary);color:var(--primary-fg);border:0;border-radius:var(--radius);padding:12px 22px;font:inherit;font-weight:800;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.ghost:disabled{opacity:.6;cursor:wait}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0 0 16px}
.seg{display:inline-flex;background:var(--muted);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted-fg);font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--primary);color:var(--primary-fg)}
.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hist[hidden]{display:none}
.hist{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.hist .chip{max-width:15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .clr{background:none;border:0;color:var(--muted-fg);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:7px 6px}
.hist .clr:hover{color:var(--fg)}
#out{margin-top:40px}
.hero{background:linear-gradient(135deg,var(--primary),oklch(0.55 0.2 300));color:#fff;border-radius:calc(var(--radius)*1.75);padding:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero h2{margin:6px 0 0;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.05;letter-spacing:-.02em}
.hero .ghost{color:#fff;border-color:rgb(255 255 255 / .5)}
.tag{font-size:.7rem;background:rgb(255 255 255 / .22);padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;letter-spacing:.05em}
ol{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid var(--border)}
.n{width:26px;color:var(--muted-fg);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.t{flex:1;min-width:0}.t b{display:block;overflow-wrap:anywhere}.t span{color:var(--muted-fg);font-size:.9rem}
li a{color:var(--primary);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
li a:hover{text-decoration:underline}
.why{display:block;font-style:normal;color:var(--muted-fg);font-size:.85rem;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sk{background:var(--muted);border-radius:var(--radius);margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.err{color:var(--err);font-weight:600;margin-top:16px}
html{-webkit-text-size-adjust:100%}
button,.chip,.sw{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
textarea{font-size:16px}
@media (max-width:560px){
.wrap{padding:0 16px}
h1{font-size:clamp(2.4rem,13vw,3.2rem)}
.lead{font-size:1.05rem;margin-top:14px}
.box{padding:14px;margin-top:22px}
.chip{padding:9px 14px}
.row{flex-direction:column;align-items:stretch;gap:14px}
.opts{flex-direction:column;gap:10px}.seg{display:flex}.seg button{flex:1;padding:9px 6px}
.sw{justify-content:center;min-height:44px}
.go{width:100%;padding:15px}
#out{margin-top:28px}
.hero{padding:20px}
.acts{width:100%}.acts .ghost{flex:1;padding:11px 10px}
li{flex-wrap:wrap;row-gap:4px}
li a{flex-basis:100%;padding-left:40px}
}
@media (prefers-reduced-motion:reduce){.fu,.sk{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
<header><img src="icon-mark.svg" alt="" width="36" height="36"><div>Mood<span>tape</span></div></header>
<main>
<h1 class="fu" style="animation-delay:.1s">Tell us the vibe. <em>We’ll press play.</em></h1>
<p class="lead fu" style="animation-delay:.2s">Describe a mood. Get a playlist.</p>
<div class="box fu" style="animation-delay:.3s">
<textarea id="mood" placeholder="Describe a mood…"></textarea>
<div class="chips" id="chips"></div>
<div class="opts">
<div class="seg" id="energy" role="radiogroup" aria-label="Energy"><button type="button" data-v="chill">Chill</button><button type="button" data-v="" class="on">Mixed</button><button type="button" data-v="hype">Hype</button></div>
<div class="seg" id="era" role="radiogroup" aria-label="Era"><button type="button" data-v="classic">Classics</button><button type="button" data-v="" class="on">Any era</button><button type="button" data-v="recent">Recent</button></div>
</div>
<div class="row">
<label class="sw"><input type="checkbox" id="opm"><span class="track"></span>OPM only 🇵🇭</label>
<button class="go" id="go">Make playlist</button>
</div>
</div>
<div class="hist" id="hist" hidden></div>
<div id="msg"></div>
<div id="out"></div>
</main>
</div>
<script>
(function(){
var WORKER_URL="https://moodtape-ai.allanacem.workers.dev";
var moods=["Rainy Sunday with coffee","Late-night drive","Gym hype","Heartbreak","Focus","Throwback","Road trip","Romantic"];
var $=function(id){return document.getElementById(id)};
var chips=$("chips"),mood=$("mood"),opm=$("opm"),go=$("go"),out=$("out"),msg=$("msg");
var last=null;
var HKEY="moodtape.history",HMAX=8;
function segVal(id){var b=$(id).querySelector(".on");return b?b.getAttribute("data-v"):""}
function segSet(id,v){[].forEach.call($(id).children,function(b){var on=b.getAttribute("data-v")===(v||"");b.classList.toggle("on",on);b.setAttribute("aria-checked",on)})}
["energy","era"].forEach(function(id){[].forEach.call($(id).children,function(b){b.setAttribute("role","radio");b.setAttribute("aria-checked",b.classList.contains("on"));b.onclick=function(){segSet(id,b.getAttribute("data-v"))}})});
function hload(){try{var h=JSON.parse(localStorage.getItem(HKEY)||"[]");return Array.isArray(h)?h:[]}catch(e){return[]}}
function hsave(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function hadd(item){var h=hload();h.unshift(item);hsave(h.slice(0,HMAX));hdraw()}
function hdraw(){var h=hload(),el=$("hist");el.innerHTML="";el.hidden=!h.length;if(!h.length)return;
h.forEach(function(it){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=it.data.title||it.mood;b.title=it.mood;
b.onclick=function(){mood.value=it.mood;opm.checked=!!it.opmOnly;segSet("energy",it.energy);segSet("era",it.era);msg.innerHTML="";
last={mood:it.mood,opmOnly:!!it.opmOnly,energy:it.energy||"",era:it.era||""};render(it.data,!!it.opmOnly,it.mood);out.scrollIntoView({behavior:"smooth",block:"start"})};el.appendChild(b)});
var c=document.createElement("button");c.type="button";c.className="clr";c.textContent="Clear";c.onclick=function(){hsave([]);hdraw()};el.appendChild(c)}
var IMPORT_URL="https://www.tunemymusic.com/transfer/freetext-to-spotify";
function copyText(txt,done){function fb(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}}
moods.forEach(function(m){var b=document.createElement("button");b.className="chip";b.type="button";b.textContent=m;
b.onclick=function(){mood.value=m};chips.appendChild(b)});
function prompt(m,o,x){x=x||{};
return "You are a playlist curator. Mood or moment: \""+m+"\".\n"+
"Pick 15 real, well-known songs that fit. Do not invent songs. For each, add a short note (max 12 words) on why it fits."+
(o?"\nIMPORTANT: Only choose songs by Filipino artists (OPM – Original Pilipino Music), from classics to current hits, in Tagalog, English, or other Philippine languages. Do not include any song by a non-Filipino artist.":"")+
({chill:"\nEnergy: favor calm, mellow, low-energy songs.",hype:"\nEnergy: favor upbeat, high-energy songs."}[x.energy]||"")+
({classic:"\nEra: favor classics released before 2005.",recent:"\nEra: favor songs released since 2020."}[x.era]||"")+
"\nReply with ONLY a JSON object: {\"title\":\"short playlist name\",\"songs\":[{\"title\":\"...\",\"artist\":\"...\",\"why\":\"...\"}]}";
}
function parse(t){t=t.replace(/```json|```/g,"").trim();var s=t.indexOf("{"),e=t.lastIndexOf("}");return JSON.parse(t.slice(s,e+1))}
function skeleton(){var h='<div class="sk" style="height:150px;border-radius:28px"></div>';for(var i=0;i<5;i++)h+='<div class="sk" style="height:52px"></div>';out.innerHTML=h}
async function run(m,o,x){x=x||{energy:"",era:""};
msg.innerHTML="";
if(!m.trim()){out.innerHTML="";msg.innerHTML='<p class="err">Type a mood or tap one above.</p>';return}
go.disabled=true;var rb=$("remix");if(rb)rb.disabled=true;
skeleton();
try{
var res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt(m,o,x)})});
if(!res.ok){var er={};try{er=await res.json()}catch(x){}throw new Error("Couldn’t reach the AI. "+(er.error||"")+(er.detail?" – "+er.detail:""))}
var data=parse((await res.json()).text);
last={mood:m,opmOnly:o,energy:x.energy,era:x.era};
render(data,o,m);
hadd({mood:m,opmOnly:o,energy:x.energy,era:x.era,data:data});
}catch(e){out.innerHTML="";msg.innerHTML='<p class="err">'+(e&&e.message?e.message:"Couldn’t make a playlist. Try again.")+"</p>"}
go.disabled=false;
}
function render(d,o,m){
out.innerHTML='<div class="hero"><div><h2></h2></div><div class="acts"><button class="ghost" id="copy">Copy track list</button><button class="ghost" id="imp">Import to Spotify</button><button class="ghost" id="remix">Remix</button></div></div><ol></ol>';
var h2=out.querySelector("h2");h2.appendChild(document.createTextNode(d.title||"Your playlist"));
if(o){var tg=document.createElement("span");tg.className="tag";tg.textContent="OPM";h2.appendChild(tg)}
var ol=out.querySelector("ol");
(d.songs||[]).forEach(function(s,i){
var li=document.createElement("li");
var n=document.createElement("div");n.className="n";n.textContent=i+1;
var t=document.createElement("div");t.className="t";
var b=document.createElement("b");b.textContent=s.title;var sp=document.createElement("span");sp.textContent=s.artist;
t.appendChild(b);t.appendChild(sp);if(s.why){var w=document.createElement("em");w.className="why";w.textContent=s.why;t.appendChild(w)}
var a=document.createElement("a");a.target="_blank";a.rel="noopener";a.textContent="Play on Spotify";
a.href="https://open.spotify.com/search/"+encodeURIComponent(s.title+" "+s.artist);
li.appendChild(n);li.appendChild(t);li.appendChild(a);ol.appendChild(li)});
$("remix").onclick=function(){run(last.mood,last.opmOnly,{energy:last.energy,era:last.era})};
$("copy").onclick=function(){var txt=(d.songs||[]).map(function(s,i){return (i+1)+". "+s.title+" – "+s.artist}).join("\n");var c=$("copy");
copyText(txt,function(){c.textContent="Copied ✓";setTimeout(function(){c.textContent="Copy track list"},1500)})};
$("imp").onclick=function(){var txt=(d.songs||[]).map(function(s){return s.artist+" - "+s.title}).join("\n");var b=$("imp");
window.open(IMPORT_URL,"_blank","noopener");
copyText(txt,function(){b.textContent="List copied – paste it ✓";setTimeout(function(){b.textContent="Import to Spotify"},3000)})};
}
go.onclick=function(){run(mood.value,opm.checked,{energy:segVal("energy"),era:segVal("era")})};
hdraw();
})();
</script>
</body>
</html>
